# Alert rules — the ones worth interrupting someone for, and nothing else.
#
# Every rule here is about a symptom a user would notice, or a resource about
# to run out. Nothing fires on «CPU is high» or «memory grew»: an alert nobody
# acts on is an alert nobody reads, and the first one people learn to ignore
# is the one that trains them to ignore the rest.
#
# ⚠️ Provisioned rules are read-only in the UI. Edit here, then restart:
#   docker compose -p dns-obs --env-file .env.obs -f docker-compose.obs.yml \
#     up -d --force-recreate grafana
#
# Shape of each rule: refId A is an INSTANT Prometheus query, refId C is a
# threshold on A. No reduce step between them — an instant query already
# returns one sample per series, and a reducer over a single point is noise.
# `condition: C` names the expression whose result decides the state.
#
# noDataState matters more than the threshold on a low-traffic service:
#   Alerting — absent data IS the failure (the target is gone)
#   OK       — absent data just means nobody used the app. histogram_quantile
#              over an empty range returns no data at 04:00, and paging for
#              that teaches everyone to mute the channel.
#
# execErrState is a DIFFERENT question, and it used to be answered wrong here.
# It fires when the rule itself cannot be evaluated — Prometheus unreachable,
# a query that errors, or Grafana's own SQLite locking up. With `Alerting`
# every such failure looked exactly like the service being down, and phantom
# alerts flapped into Telegram while the service was fine. `Error` routes them
# to their own contact point instead, where they read as what they are: a
# broken rule, not a broken API. See policies.yml.

apiVersion: 1

groups:
    - orgId: 1
      name: client-api
      # Matches the dashboards provider folder, so an alert and the dashboard
      # it came from live in the same place.
      folder: 'DNS'
      interval: 1m
      rules:
          # ── availability ────────────────────────────────────────────────
          - uid: dns-readiness-failing
            title: client-api readiness failing
            condition: C
            for: 2m
            noDataState: Alerting
            execErrState: Error
            labels:
                severity: critical
                service: client-api
            annotations:
                summary: '/api/v1/health/ready is not returning 200 — the API is running but cannot serve'
                description: >-
                    The readiness route asks Postgres directly, so this fires when the database
                    is unreachable even though the process is perfectly healthy — /health would
                    still answer ok. Postgres runs outside Docker here, so start there:
                    `systemctl status postgresql`, then the container's own logs.
                runbook_url: https://github.com/amelin0/recipes-app-monorepo/blob/development/infra/prod/README.md
            data:
                - refId: A
                  relativeTimeRange: { from: 300, to: 0 }
                  datasourceUid: prometheus
                  model:
                      refId: A
                      editorMode: code
                      expr: 'probe_success{job="blackbox-ready"}'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                - refId: C
                  relativeTimeRange: { from: 0, to: 0 }
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      datasource: { type: __expr__, uid: __expr__ }
                      conditions:
                          - evaluator: { type: lt, params: [1] }
                            operator: { type: and }
                            query: { params: [] }
                            reducer: { type: last, params: [] }
                            type: query
                      intervalMs: 1000
                      maxDataPoints: 43200

          - uid: dns-api-unscrapeable
            title: client-api not responding to scrapes
            condition: C
            for: 2m
            noDataState: Alerting
            execErrState: Error
            labels:
                severity: critical
                service: client-api
            annotations:
                summary: 'Prometheus cannot reach client-api /metrics — the container is down, off the network, or on a different port than prometheus.yml expects'
                description: >-
                    Distinct from the readiness alert: the process itself is unreachable rather
                    than a dependency having failed. A deploy that failed its health gate, a
                    crash loop, or the dns-net network having been recreated without the
                    application stack rejoining it.
                runbook_url: https://github.com/amelin0/recipes-app-monorepo/blob/development/infra/prod/README.md
            data:
                - refId: A
                  relativeTimeRange: { from: 300, to: 0 }
                  datasourceUid: prometheus
                  model:
                      refId: A
                      editorMode: code
                      expr: 'up{job="client-api"}'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                - refId: C
                  relativeTimeRange: { from: 0, to: 0 }
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      datasource: { type: __expr__, uid: __expr__ }
                      conditions:
                          - evaluator: { type: lt, params: [1] }
                            operator: { type: and }
                            query: { params: [] }
                            reducer: { type: last, params: [] }
                            type: query
                      intervalMs: 1000
                      maxDataPoints: 43200

          # ── request health ──────────────────────────────────────────────
          - uid: dns-5xx-rate
            title: client-api 5xx rate above 5%
            condition: C
            for: 5m
            # No traffic means no errors, not an incident.
            noDataState: OK
            execErrState: Error
            labels:
                severity: warning
                service: client-api
            annotations:
                summary: 'More than 5% of responses are server errors over the last 5 minutes'
                description: >-
                    The same expression as the dashboard's «5xx share» stat. The denominator is
                    clamped, so one error on an otherwise idle night does not read as 100%.
                    4xx are excluded deliberately — a client sending bad input is not an outage.
                    Start with the «Errors and warnings» log panel on the DNS · client-api
                    dashboard.
            data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model:
                      refId: A
                      editorMode: code
                      expr: >-
                          sum(rate(http_request_duration_seconds_count{service="client-api",status=~"5.."}[5m]))
                          / clamp_min(sum(rate(http_request_duration_seconds_count{service="client-api"}[5m])), 0.0001)
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                - refId: C
                  relativeTimeRange: { from: 0, to: 0 }
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      datasource: { type: __expr__, uid: __expr__ }
                      conditions:
                          - evaluator: { type: gt, params: [0.05] }
                            operator: { type: and }
                            query: { params: [] }
                            reducer: { type: last, params: [] }
                            type: query
                      intervalMs: 1000
                      maxDataPoints: 43200

          - uid: dns-p95-latency
            title: client-api p95 latency above 1s
            condition: C
            for: 10m
            noDataState: OK
            execErrState: Error
            labels:
                severity: warning
                service: client-api
            annotations:
                summary: 'p95 request latency has been over 1s for 10 minutes'
                description: >-
                    Ten minutes, not five: a deploy or a migration produces a legitimate
                    multi-minute spike, and paging for those is how the channel gets muted.
                    Check «p95 latency by route» to see whether it is one endpoint or
                    everything — the catalogue list does the most joins and is the usual
                    first suspect.
            data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model:
                      refId: A
                      editorMode: code
                      expr: >-
                          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="client-api"}[5m])))
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                - refId: C
                  relativeTimeRange: { from: 0, to: 0 }
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      datasource: { type: __expr__, uid: __expr__ }
                      conditions:
                          - evaluator: { type: gt, params: [1] }
                            operator: { type: and }
                            query: { params: [] }
                            reducer: { type: last, params: [] }
                            type: query
                      intervalMs: 1000
                      maxDataPoints: 43200

    - orgId: 1
      name: admin-api
      folder: 'DNS'
      interval: 1m
      rules:
          # Warning, not critical: admin-api has two routes and no users yet.
          # It is here so the alert exists before the domain modules do —
          # promote it when the admin panel actually depends on it.
          - uid: dns-admin-api-down
            title: admin-api not answering
            condition: C
            for: 5m
            noDataState: Alerting
            execErrState: Error
            labels:
                severity: warning
                service: admin-api
            annotations:
                summary: 'admin-api /api/v1/health is not returning 200'
                description: >-
                    It exposes no metrics of its own, so this is a plain liveness probe. The
                    service currently has only /health and /docs — nothing depends on it yet,
                    which is why this is a warning.
            data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model:
                      refId: A
                      editorMode: code
                      expr: 'probe_success{job="blackbox-admin"}'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                - refId: C
                  relativeTimeRange: { from: 0, to: 0 }
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      datasource: { type: __expr__, uid: __expr__ }
                      conditions:
                          - evaluator: { type: lt, params: [1] }
                            operator: { type: and }
                            query: { params: [] }
                            reducer: { type: last, params: [] }
                            type: query
                      intervalMs: 1000
                      maxDataPoints: 43200

    - orgId: 1
      name: worker
      folder: 'DNS'
      interval: 1m
      rules:
          # The worker answers no requests, so nothing about it is visible the
          # way a broken API is: «idle» and «dead» look identical from outside.
          # This is the only thing that tells them apart.
          #
          # noDataState is OK on purpose. `up` reports 0 for a target that is
          # configured and unreachable — that is the failure this catches. It
          # goes ABSENT only when the scrape config no longer lists the worker,
          # which happens before the first deploy that ships it; paging then
          # would mean the alert fires on a service that does not exist yet.
          - uid: dns-worker-down
            title: worker not answering
            condition: C
            for: 10m
            noDataState: OK
            execErrState: Error
            labels:
                severity: warning
                service: worker
            annotations:
                summary: 'The background worker is unreachable — nightly cleanup and subscription expiry are not running'
                description: >-
                    Warning rather than critical, and deliberately so: no user request passes
                    through this process. What degrades is slow — token tables grow, and
                    people stop being told their subscription is about to end. It can wait
                    for the morning.
                runbook_url: https://github.com/amelin0/recipes-app-monorepo/blob/development/docs/runbooks/worker-not-running-jobs.md
            data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model:
                      refId: A
                      editorMode: code
                      expr: 'up{job="worker"}'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                - refId: C
                  relativeTimeRange: { from: 0, to: 0 }
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      datasource: { type: __expr__, uid: __expr__ }
                      conditions:
                          - evaluator: { type: lt, params: [1] }
                            operator: { type: and }
                            query: { params: [] }
                            reducer: { type: last, params: [] }
                            type: query
                      intervalMs: 1000
                      maxDataPoints: 43200

          # The one alert here that is about a promise rather than a machine.
          #
          # It reads AGE, not count. Carrying out a deletion is still a manual
          # weekly runbook (ADR-0005 is unresolved), so «some requests are
          # overdue» is the ordinary state on a Tuesday and a count-based rule
          # would fire every week. Ten days means the weekly run has been
          # missed — and age, unlike a ten-day `for:` on a count, survives
          # Grafana restarting.
          - uid: dns-overdue-account-deletions
            title: account deletions overdue by more than 10 days
            condition: C
            for: 1h
            # The worker being down is dns-worker-down's job to say; this rule
            # staying quiet then is correct, not a gap.
            noDataState: OK
            execErrState: Error
            labels:
                severity: warning
                service: worker
            annotations:
                summary: 'Someone asked us to delete their account more than 10 days after the date we promised, and it is still here'
                description: >-
                    Not an outage — a commitment with a date on it that nobody has kept. The
                    procedure is manual until ADR-0005 settles what deletion erases; run the
                    runbook, and if this keeps firing, that is the argument for finishing the
                    ADR rather than for raising the threshold.
                runbook_url: https://github.com/amelin0/recipes-app-monorepo/blob/development/docs/runbooks/execute-overdue-account-deletions.md
            data:
                - refId: A
                  relativeTimeRange: { from: 3600, to: 0 }
                  datasourceUid: prometheus
                  model:
                      refId: A
                      editorMode: code
                      expr: 'dns_account_deletion_requests_oldest_overdue_seconds'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                - refId: C
                  relativeTimeRange: { from: 0, to: 0 }
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      datasource: { type: __expr__, uid: __expr__ }
                      conditions:
                          - evaluator: { type: gt, params: [864000] }
                            operator: { type: and }
                            query: { params: [] }
                            reducer: { type: last, params: [] }
                            type: query
                      intervalMs: 1000
                      maxDataPoints: 43200

    - orgId: 1
      name: deploy
      folder: 'DNS'
      interval: 1m
      rules:
          # The Telegram message from deploy.sh says a deploy failed the moment
          # it happens. This says it is STILL the case: a failed or rolled-back
          # deploy leaves healthy containers, so no other rule here notices
          # that the server runs an older build than development.
          #
          # noDataState is OK: the metric exists only once a deploy.sh that
          # writes it has run, and paging before that would be about nothing.
          # It does not see a deploy that never started (runner offline) —
          # that needs a signal from outside the server.
          - uid: dns-deploy-failed
            title: last deploy did not ship
            condition: C
            for: 15m
            noDataState: OK
            execErrState: Error
            labels:
                severity: warning
                service: deploy
            annotations:
                summary: 'The last deploy failed or was rolled back — the dev server is running an older build than development'
                description: >-
                    deploy.sh reports every outcome to Telegram when it happens; this rule
                    keeps saying so until a deploy succeeds. Open the last run of the deploy
                    workflow in GitHub Actions. A rollback leaves the migrations of the failed
                    build applied, so fix forward rather than waiting.
                runbook_url: https://github.com/amelin0/recipes-app-monorepo/blob/development/infra/prod/README.md
            data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model:
                      refId: A
                      editorMode: code
                      expr: 'dns_deploy_last_run_success'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                - refId: C
                  relativeTimeRange: { from: 0, to: 0 }
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      datasource: { type: __expr__, uid: __expr__ }
                      conditions:
                          - evaluator: { type: lt, params: [1] }
                            operator: { type: and }
                            query: { params: [] }
                            reducer: { type: last, params: [] }
                            type: query
                      intervalMs: 1000
                      maxDataPoints: 43200

    - orgId: 1
      name: host
      folder: 'DNS'
      interval: 1m
      rules:
          # ── the box ─────────────────────────────────────────────────────
          - uid: dns-disk-low
            title: Disk below 15% free
            condition: C
            for: 15m
            noDataState: Alerting
            execErrState: Error
            labels:
                severity: critical
                service: host
            annotations:
                summary: 'Less than 15% free on a real filesystem — Loki chunks and the Postgres data directory both live here'
                description: >-
                    This is the failure that takes the database down rather than the API:
                    Postgres is what stops first when the disk fills. Loki caps at 14 days and
                    container logs at 10MB x 3, so sustained growth usually means something
                    else. Start with `docker system df` and `du -shx /var/lib/docker/*`.
                runbook_url: https://github.com/amelin0/recipes-app-monorepo/blob/development/infra/prod/README.md
            data:
                - refId: A
                  relativeTimeRange: { from: 900, to: 0 }
                  datasourceUid: prometheus
                  model:
                      refId: A
                      editorMode: code
                      expr: >-
                          min(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                - refId: C
                  relativeTimeRange: { from: 0, to: 0 }
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      datasource: { type: __expr__, uid: __expr__ }
                      conditions:
                          - evaluator: { type: lt, params: [0.15] }
                            operator: { type: and }
                            query: { params: [] }
                            reducer: { type: last, params: [] }
                            type: query
                      intervalMs: 1000
                      maxDataPoints: 43200

          - uid: dns-memory-low
            title: Available memory below 10%
            condition: C
            for: 10m
            noDataState: Alerting
            execErrState: Error
            labels:
                severity: warning
                service: host
            annotations:
                summary: 'Under 10% of RAM available — the OOM killer picks its victim by size, and Postgres is the biggest'
                description: >-
                    MemAvailable, not MemFree: page cache is reclaimable, and counting it as
                    used would make this fire constantly. A docker build on this host is a
                    legitimate transient cause.
            data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model:
                      refId: A
                      editorMode: code
                      expr: 'node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                - refId: C
                  relativeTimeRange: { from: 0, to: 0 }
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      datasource: { type: __expr__, uid: __expr__ }
                      conditions:
                          - evaluator: { type: lt, params: [0.1] }
                            operator: { type: and }
                            query: { params: [] }
                            reducer: { type: last, params: [] }
                            type: query
                      intervalMs: 1000
                      maxDataPoints: 43200
