# Routing: which alert reaches which contact point, and how often it repeats.
#
# ⚠️ Provisioning a policy REPLACES Grafana's default notification policy —
# the one pointing at grafana-default-email, which is not configured here and
# would silently swallow every alert. It also makes routing read-only in the
# UI; edit this file and restart Grafana instead.

apiVersion: 1

policies:
    - orgId: 1
      receiver: telegram

      # Group by rule, not by instance. Without alertname in the key a disk
      # alert and a latency alert would arrive in one message; with more than
      # alertname in it, one message per filesystem.
      group_by: ['grafana_folder', 'alertname']

      # Let a burst settle before the first message: a reboot trips readiness,
      # the scrape target and the database probe within seconds of each other,
      # and one message about three things beats three messages.
      group_wait: 30s
      group_interval: 5m

      # A still-firing alert re-pings every 4h. Long on purpose — a phone
      # buzzing every five minutes about a problem already known is how people
      # mute the channel entirely.
      repeat_interval: 4h

      routes:
          # FIRST, and the order is the whole point: routes are matched top
          # down and the first match wins. Grafana's own DatasourceError alerts
          # carry the failing rule's labels, `severity: critical` included, so
          # the route below would otherwise claim them and page every hour.
          - receiver: telegram-rule-health
            object_matchers:
                - ['alertname', '=~', 'DatasourceError|DatasourceNoData']
            group_by: ['grafana_folder', 'alertname']
            # Five minutes of silence before the first word. A storage hiccup
            # that clears inside that window never becomes a message at all —
            # which is precisely the class of failure that was flooding the
            # channel every minute.
            group_wait: 5m
            group_interval: 30m
            # Half a day. A rule that stays broken is worth saying twice a day
            # and no more; it is not an outage, and nobody fixes it at 03:00.
            repeat_interval: 12h

          # Critical means «the API is not serving» or «the disk is about to
          # fill». Same channel, but it should not sit in a 30s batch window,
          # and it is worth repeating more often than a warning.
          - receiver: telegram
            object_matchers:
                - ['severity', '=', 'critical']
            group_wait: 10s
            group_interval: 5m
            repeat_interval: 1h

          # The worker's alerts are both «look at it in the morning»: no user
          # request passes through that process, and the deletion backlog is
          # cleared by a runbook somebody runs on a working day. Once a day is
          # therefore the right cadence — the default 4h would re-ping a dozen
          # times about a task that was always going to wait until Monday, and
          # that is exactly how a channel gets muted.
          - receiver: telegram
            object_matchers:
                - ['service', '=', 'worker']
            group_wait: 5m
            group_interval: 1h
            repeat_interval: 24h
